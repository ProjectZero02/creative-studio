name: Feature idea
description: Suggest a new studio, demo or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the studio do, and for whom?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The demo or client need behind it.
