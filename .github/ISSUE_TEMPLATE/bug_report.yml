name: Bug report
description: Something in the studio is broken or looks wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Short and specific is perfect.
  - type: input
    id: page
    attributes:
      label: Page
      description: Which page or studio? For example /story or Video Studio.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options:
        - Local, mock mode
        - Local, real models
        - Cloud Run
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any error text from the browser or server logs. Remove secrets first.
      render: text
